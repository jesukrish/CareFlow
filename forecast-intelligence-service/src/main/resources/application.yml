server:
  port: 8083

spring:
  application:
    name: forecast-intelligence-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careflow}
    username: ${DB_USERNAME:careflow}
    password: ${DB_PASSWORD:careflow123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Inter-service URLs
careflow:
  services:
    patient-url: ${PATIENT_SERVICE_URL:http://localhost:8081}
    bed-url: ${BED_SERVICE_URL:http://localhost:8082}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    timeout-seconds: ${GEMINI_TIMEOUT:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.careflow: INFO
    org.springframework: WARN
